      - name: Upload macOS x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: darwin-x64-app
          if-no-files-found: error
          retention-days: 7
          path: code-oss/VSCode-darwin-x64.zip

  macos-universal:
    name: macOS Universal (.zip)
    runs-on: macos-14
    timeout-minutes: 30
    needs: [macos-x64, macos-arm64]
    if: always() && (needs.macos-x64.result == 'success' && needs.macos-arm64.result == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: code-oss/.nvmrc

      - name: Ensure bundler deps (build package)
        working-directory: code-oss/build
        run: npm ci

      - name: Download mac x64 app
        uses: actions/download-artifact@v4
        with:
          name: darwin-x64-app
          path: .

      - name: Download mac arm64 app
        uses: actions/download-artifact@v4
        with:
          name: darwin-arm64-app
          path: .

      - name: Unzip app bundles
        run: |
          unzip -q VSCode-darwin-x64.zip
          unzip -q VSCode-darwin-arm64.zip

      - name: Create universal app
        working-directory: code-oss
        run: |
          node ./build/darwin/create-universal-app.js "$GITHUB_WORKSPACE"

      - name: Zip universal app bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent VSCode-darwin-universal VSCode-darwin-universal.zip

      - name: Upload macOS universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: darwin-universal-app
          if-no-files-found: error
          retention-days: 7
          path: VSCode-darwin-universal.zip

  release:
    name: Publish GitHub Release (on tag)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/') && always()
    needs:
      - linux-x64
      - linux-arm64
      - linux-armhf
      - windows-x64
      - windows-arm64
      - macos-arm64
      - macos-x64
      - macos-universal
      - server-linux-x64
      - server-linux-arm64
      - server-linux-armhf
      - server-windows-x64
      - server-windows-arm64
      - server-macos-x64
      - server-macos-arm64
      - server-alpine-arm64
    permissions:
      contents: write
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          merge-multiple: true
          path: dist

      - name: List artifacts
        run: |
          echo "Assets to release:" && ls -R dist || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            dist/**

