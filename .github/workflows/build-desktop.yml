name: Build Desktop Binaries

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

env:
  NODE_OPTIONS: '--max-old-space-size=8192'
  GITHUB_TOKEN: ${{ github.token }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64:
    name: Linux x64 (.deb/.rpm + tar)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: code-oss
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: code-oss/.nvmrc
          cache: npm
          cache-dependency-path: code-oss/package-lock.json

      - name: Install system dependencies (rpm/deb tooling)
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm rpm2cpio cpio fakeroot dpkg-dev xz-utils tar
          sudo apt-get install -y libkrb5-dev libgssapi-krb5-2 build-essential python3-dev libx11-dev libxkbfile-dev

      - name: Install npm dependencies
        run: |
          # Try to install with retries and better error handling
          npm ci --no-audit --no-fund --prefer-offline --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000 --fetch-retries=3 || \
          (echo "Initial npm install failed, trying without prefer-offline..." && npm ci --no-audit --no-fund --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000 --fetch-retries=3)
          npm list --depth=0

      - name: Download built-in extensions
        run: npm run download-builtin-extensions

      - name: Build VS Code for Linux x64 (minified)
        run: npm run gulp -- vscode-linux-x64-min

      - name: Build Linux packages (.deb/.rpm)
        run: |
          npm run gulp -- vscode-linux-x64-prepare-deb
          npm run gulp -- vscode-linux-x64-build-deb
          npm run gulp -- vscode-linux-x64-prepare-rpm
          npm run gulp -- vscode-linux-x64-build-rpm

      - name: Archive Linux app folder
        run: |
          tar -C .. -czf VSCode-linux-x64.tar.gz VSCode-linux-x64

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            code-oss/VSCode-linux-x64.tar.gz
            code-oss/.build/linux/deb/amd64/deb/*.deb
            code-oss/.build/linux/rpm/x86_64/*.rpm

  server-linux-x64:
    name: Server Linux x64 (REH + REH Web)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: code-oss
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: code-oss/.nvmrc
          cache: npm
          cache-dependency-path: code-oss/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev libgssapi-krb5-2 build-essential python3-dev libx11-dev libxkbfile-dev

      - name: Install npm dependencies
        run: |
          # Try to install with retries and better error handling
          npm ci --no-audit --no-fund --prefer-offline --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000 --fetch-retries=3 || \
          (echo "Initial npm install failed, trying without prefer-offline..." && npm ci --no-audit --no-fund --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000 --fetch-retries=3)
          npm list --depth=0

      - name: Download built-in extensions
        run: npm run download-builtin-extensions

      - name: Build VS Code Server (REH) Linux x64 (minified)
        run: npm run gulp -- vscode-reh-linux-x64-min

      - name: Archive REH package
        run: |
          tar -C .. -czf vscode-reh-linux-x64.tar.gz vscode-reh-linux-x64

      - name: Build VS Code Server Web (REH Web) Linux x64 (minified)
        run: npm run gulp -- vscode-reh-web-linux-x64-min

      - name: Archive REH Web package
        run: |
          tar -C .. -czf vscode-reh-web-linux-x64.tar.gz vscode-reh-web-linux-x64

      - name: Upload Server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-linux-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            code-oss/vscode-reh-linux-x64.tar.gz
            code-oss/vscode-reh-web-linux-x64.tar.gz

  windows-x64:
    name: Windows x64 (installers + zip)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: code-oss
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: code-oss/.nvmrc
          cache: npm
          cache-dependency-path: code-oss/package-lock.json

      - name: Install npm dependencies
        run: |
          # Try to install with retries and better error handling
          npm ci --no-audit --no-fund --prefer-offline --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000 --fetch-retries=3 || \
          (echo "Initial npm install failed, trying without prefer-offline..." && npm ci --no-audit --no-fund --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000 --fetch-retries=3)
          npm list --depth=0

      - name: Download built-in extensions
        run: npm run download-builtin-extensions

      - name: Build VS Code for Windows x64 (minified)
        run: npm run gulp -- vscode-win32-x64-min

      - name: Build Windows installers (User + System)
        run: |
          npm run gulp -- vscode-win32-x64-user-setup
          npm run gulp -- vscode-win32-x64-system-setup

      - name: Archive Windows app folder
        run: |
          Set-StrictMode -Version Latest
          cd ..
          Compress-Archive -Path 'VSCode-win32-x64\*' -DestinationPath 'VSCode-win32-x64.zip'
          Move-Item -Path 'VSCode-win32-x64.zip' -Destination 'code-oss\VSCode-win32-x64.zip' -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            code-oss/VSCode-win32-x64.zip
            code-oss/.build/win32-x64/user-setup/*.exe
            code-oss/.build/win32-x64/system-setup/*.exe

  macos-arm64:
    name: macOS arm64 (.zip)
    runs-on: macos-14
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: code-oss
    env:
      npm_config_cache: /tmp/.npm
      npm_config_prefer_offline: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: code-oss/.nvmrc
          cache: npm
          cache-dependency-path: code-oss/package-lock.json

      - name: Install npm dependencies
        run: |
          # Try to install with retries and better error handling
          npm ci --no-audit --no-fund --prefer-offline --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000 --fetch-retries=3 || \
          (echo "Initial npm install failed, trying without prefer-offline..." && npm ci --no-audit --no-fund --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000 --fetch-retries=3)
          npm list --depth=0

      - name: Download built-in extensions
        run: npm run download-builtin-extensions

      - name: Build VS Code for macOS arm64 (minified)
        run: npm run gulp -- vscode-darwin-arm64-min

      - name: Zip app bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent ../VSCode-darwin-arm64 VSCode-darwin-arm64.zip

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64-app
          if-no-files-found: error
          retention-days: 7
          path: code-oss/VSCode-darwin-arm64.zip

  macos-x64:
    name: macOS x64 (.zip)
    runs-on: macos-13
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: code-oss
    env:
      npm_config_cache: /tmp/.npm
      npm_config_prefer_offline: true
    steps:
      - name: Checkout
